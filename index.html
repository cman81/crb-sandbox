<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CRB Sandbox</title>    
    <style>
        body { 
            margin: 0; 
            background: #1a202c; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden;
        }

        #phaser-game {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #phaser-game canvas {
            max-width: 100% !important;
            max-height: 100% !important;
            object-fit: contain;
        }

        /* 🌟 THE POSITIONING LOCK OVERRIDE */
        /* Forces the inner virtual 1920x1080 HTML parent container div 
           to mirror the precise, centered hardware coordinates of your canvas */
        /* 🌟 THE FINE-TUNING POSITIONING LOCK */
        #phaser-game > div {
            margin-top: 4.81px !important; /* Keep your vertical letterbox lock */
            margin-left: 0px !important;
            
            /* Nudge horizontally (X) and vertically (Y) as needed.
            Positive X moves it right, negative X moves it left. */
            transform: translate(0px, 0px) !important; 
        }
    </style>

</head>
<body>

    <!-- THE CONTAINER: The target hook element for our game window -->
    <div id="phaser-game"></div>

    <!-- 1. LOAD EXTERNAL ENGINES & LIBRARIES FIRST -->
    <script src="vendor/socketio/socket.io.min.js"></script>
    <script src="vendor/phaserjs/phaser.min.js"></script>

    <!-- 2. LOAD COMPONENT SCENE BLUEPRINTS (ORDER INDEPENDENT BUT MUST BE BEFORE GAME.JS) -->
    <script src="BootScene.js"></script>
    <script src="LobbyScene.js"></script>
    <script src="DeckPrepScene.js"></script>
    <script src="GameScene.js"></script>
    <script src="DeveloperMode.js"></script>

    <!-- 3. MAIN EXECUTION ENGINE CONFIGURATION AND CORE BOOT LAYER -->
    <script src="game.js"></script>

</body>
</html>
